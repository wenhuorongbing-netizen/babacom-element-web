# Builds the BabaCom web app with the patched Element Call widget, runs BabaCom's end-to-end tests against that
# build, and uploads it as the `babacom-webapp` artifact so packaging uses the same output.
name: BabaCom
on:
    pull_request: {}
    push:
        branches: [babacom/main]
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes
permissions: {} # No permissions required
jobs:
    build-and-e2e:
        name: BabaCom build and e2e
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  cache: "pnpm"
                  node-version: "lts/*"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Locate patched Element Call widget
              id: widget
              working-directory: apps/web
              run: echo "dir=$(node scripts/build-babacom-call-widget.mjs --print-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache patched Element Call widget
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ steps.widget.outputs.dir }}
                  key: babacom-call-widget-${{ hashFiles('patches/babacom-element-call-v0.26.0.patch', 'apps/web/scripts/babacom-call-widget.ts', 'apps/web/scripts/build-babacom-call-widget.mjs') }}

            # A no-op when the cache restored a widget matching the current pins and patch
            - name: Build patched Element Call widget
              working-directory: apps/web
              run: node scripts/build-babacom-call-widget.mjs

            # Fails if the patched widget is missing or stale (see webpack.config.ts)
            - name: Build BabaCom web app
              working-directory: apps/web
              run: |
                  cp config.babacom.json config.json
                  pnpm run build

            - uses: ./.github/actions/setup-playwright
              with:
                  write-cache: true

            # test:playwright also builds the shared Playwright helpers (packages/playwright-common) first
            - name: Run BabaCom end-to-end tests
              working-directory: apps/web
              run: >
                  pnpm test:playwright --project=Chrome
                  playwright/e2e/voip/babacom-voice-controls.spec.ts
                  playwright/e2e/login/babacom-translations.spec.ts

            - name: Upload BabaCom web app
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: babacom-webapp
                  path: apps/web/webapp
                  retention-days: 14
                  if-no-files-found: error

            - name: Upload Playwright results
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: babacom-playwright-results
                  path: apps/web/playwright/test-results
                  retention-days: 14
                  if-no-files-found: ignore

    # Packages exactly the babacom-webapp that passed e2e in this run, as an unsigned internal test candidate
    package-windows:
        name: BabaCom Windows package
        needs: build-and-e2e
        runs-on: windows-2025
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            - name: Configure git line endings
              run: |
                  git config --system core.autocrlf false
                  git config --system core.eol lf

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Download BabaCom web app from this run
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: babacom-webapp
                  path: apps/desktop/webapp

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: "pnpm"

            - name: Install dependencies
              working-directory: apps/desktop
              run: pnpm install --frozen-lockfile --filter element-desktop

            - name: Pack web app
              working-directory: apps/desktop
              run: pnpm run asar-webapp

            # No signing certificate is configured, so the output is unsigned. Electron is the version pinned in
            # package.json, downloaded from its GitHub release and verified against the release checksums.
            - name: Build Windows app and installer
              working-directory: apps/desktop
              env:
                  VARIANT_PATH: babacom/build.json
              run: pnpm run build --publish never --x64 -w squirrel

            # Start and quit the candidate in an isolated profile. Playwright needs the Node inspector, which the shipped
            # build disables through an Electron fuse, so the test runs on a copy with that fuse enabled.
            - name: Smoke test the candidate in an isolated profile
              working-directory: apps/desktop
              run: |
                  cp -r dist/win-unpacked "$RUNNER_TEMP/smoke-app"
                  pnpm exec electron-fuses write --app "$RUNNER_TEMP/smoke-app/BabaCom Internal Test.exe" EnableNodeCliInspectArguments=on
                  ELEMENT_DESKTOP_EXECUTABLE="$RUNNER_TEMP/smoke-app/BabaCom Internal Test.exe" \
                      pnpm exec playwright test playwright/e2e/launch/babacom-candidate.spec.ts

            - name: Label build and write checksums
              working-directory: apps/desktop/dist
              env:
                  SOURCE_SHA: ${{ github.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  7z a -tzip -bd babacom-internal-test-win-unpacked.zip ./win-unpacked > /dev/null
                  cp squirrel-windows/*.exe .
                  {
                      echo "UNSIGNED INTERNAL TEST CANDIDATE - not a release"
                      echo "Source commit: $SOURCE_SHA"
                      echo "Built by: $RUN_URL"
                      echo "Windows will report an unknown publisher; do not disable that check."
                  } > BUILD-INFO.txt
                  sha256sum -- *.exe *.zip > SHA256SUMS.txt
                  cat BUILD-INFO.txt SHA256SUMS.txt

            - name: Upload Windows package
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: babacom-windows-unsigned
                  path: |
                      apps/desktop/dist/*.exe
                      apps/desktop/dist/*.zip
                      apps/desktop/dist/BUILD-INFO.txt
                      apps/desktop/dist/SHA256SUMS.txt
                  retention-days: 14
                  if-no-files-found: error
